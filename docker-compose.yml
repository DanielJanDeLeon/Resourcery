services:

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: resourcery_db
    environment:
      POSTGRES_DB: resourcery_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d resourcery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/php/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Auth service (Spring Boot) ─────────────────────────────────────────────
  sb:
    image: amazoncorretto:21
    platform: linux/amd64
    container_name: resourcery_auth
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/resourcery_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - GOOGLE_CLIENT_ID=831686709531-tc6anolbilrjcksfk4oukecjc0ekje3g.apps.googleusercontent.com
    volumes:
      - ./backend/sb:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── Resources API (PHP) ────────────────────────────────────────────────────
  php:
    build:
      context: ./backend/php
      dockerfile: Dockerfile
    container_name: resourcery_php
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=resourcery_db
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/php:/var/www/html
      - php_vendor:/var/www/html/vendor

  # ── Bookings service (Django) ──────────────────────────────────────────────
  django:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
    container_name: resourcery_django
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=resourcery_db
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - PHP_API_URL=http://php:80
    volumes:
      - ./backend/django:/app
    command: >
      sh -c "python manage.py makemigrations bookings && python manage.py migrate && python manage.py cancel_no_pickup && (while true; do sleep 86400 && python manage.py cancel_no_pickup; done) & python manage.py runserver 0.0.0.0:8000"

  # ── React frontend ─────────────────────────────────────────────────────────
  react:
    image: node:20-alpine
    platform: linux/amd64
    container_name: resourcery_react
    depends_on:
      - sb
      - php
      - django
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_PHP_API_URL=http://localhost:8081
      - VITE_DJANGO_API_URL=http://localhost:8082
      - VITE_GOOGLE_CLIENT_ID=831686709531-tc6anolbilrjcksfk4oukecjc0ekje3g.apps.googleusercontent.com
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./react:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  php_vendor:
