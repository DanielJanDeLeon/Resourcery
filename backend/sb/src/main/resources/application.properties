# ===============================
# DATABASE / FLYWAY CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5434/resourcery_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=validate

# ===============================
# ADMIN SEED ACCOUNT
# ===============================
admin.username=Daniel
admin.password=Daniel

# ===============================
# GOOGLE OAUTH
# ===============================
google.client.id=${GOOGLE_CLIENT_ID}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
jwt.expiration=86400000
jwt.cookie.domain=localhost

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
